<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Directory</title>
    <script src="users.js" defer></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; }
        .user-card { border: 1px solid #ccc; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        #status { font-weight: bold; color: #555; }
        .error { color: red; }
    </style>
</head>
<body>

    <h1>User Directory</h1>
    
    <button id="load-users">Load Users</button>
    
    <div style="margin-top: 15px;">
        <label for="filter-input">Filter by name:</label>
        <input type="text" id="filter-input" placeholder="Type a name...">
    </div>

    <p id="status"></p>
    
    <ul id="users-list" style="list-style-type: none; padding: 0;"></ul>

</body>
</html>
