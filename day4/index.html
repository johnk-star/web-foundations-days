<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Character Counter & Dark Mode</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <div class="container">
        <h1>Live Note Counter</h1>
        
        <label for="note-text">Type your notes below:</label>
        <textarea id="note-text" placeholder="Start typing..."></textarea>
        
        <p id="char-count">0 / 200 characters</p>
        <p id="word-count">0 words</p>

        <div class="actions">
            <button id="clear-btn">Clear</button>
            <button id="theme-toggle">Dark mode</button>
        </div>
    </div>

</body>
</html>
